<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cricket Champions 3D</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --gold: #ffb300;
    --orange: #ff6b35;
    --dark: #0a0e27;
    --card: #1a1f3a;
    --border: #2a3f5f;
    --text-light: #9aa3b2;
    --success: #22c55e;
    --danger: #ef4444;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: var(--dark);
    color: #eee;
    overflow: hidden;
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100vh;
}

#gameContainer {
    width: 100%;
    height: 100%;
    position: relative;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

.hud {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    pointer-events: none;
    font-size: 13px;
}

.hud > * {
    pointer-events: all;
}

.scoreboard {
    position: fixed;
    top: 10px;
    right: 10px;
    width: 360px;
    background: rgba(26, 31, 58, 0.98);
    border: 2px solid var(--gold);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    z-index: 100;
}

.scoreboard-header {
    background: linear-gradient(135deg, var(--gold), var(--orange));
    color: #000;
    padding: 12px;
    font-weight: bold;
    font-size: 14px;
    text-align: center;
    display: flex;
    justify-content: space-around;
    align-items: center;
}

.scoreboard-header .team-name {
    flex: 1;
}

.scoreboard-header .vs {
    margin: 0 10px;
    opacity: 0.7;
}

.scoreboard-body {
    display: flex;
    padding: 15px;
    gap: 15px;
}

.team-score {
    flex: 1;
    text-align: center;
}

.score-value {
    font-size: 32px;
    font-weight: bold;
    color: var(--gold);
    line-height: 1;
}

.score-overs {
    font-size: 12px;
    color: var(--text-light);
    margin-top: 5px;
}

.divider {
    width: 1px;
    background: var(--border);
}

.batsman-info {
    position: fixed;
    top: 200px;
    right: 10px;
    width: 360px;
    background: rgba(26, 31, 58, 0.95);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    z-index: 100;
}

.bowler-info {
    position: fixed;
    top: 350px;
    right: 10px;
    width: 360px;
    background: rgba(26, 31, 58, 0.95);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    z-index: 100;
}

.player-card {
    background: linear-gradient(135deg, rgba(255, 179, 0, 0.1), rgba(255, 107, 53, 0.1));
    border-radius: 8px;
    padding: 10px;
}

.player-name {
    color: var(--gold);
    font-weight: bold;
    margin-bottom: 8px;
    font-size: 14px;
}

.player-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.stat {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    padding: 4px;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 4px;
}

.stat span:last-child {
    color: var(--gold);
    font-weight: bold;
}

.controls {
    position: fixed;
    bottom: 20px;
    left: 20px;
    width: 350px;
    background: rgba(26, 31, 58, 0.98);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    z-index: 100;
    max-height: 350px;
    overflow-y: auto;
}

.controls-title {
    color: var(--gold);
    font-weight: bold;
    margin-bottom: 10px;
    text-transform: uppercase;
    font-size: 12px;
    letter-spacing: 1px;
}

.shot-buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}

.shot-btn {
    background: var(--card);
    border: 2px solid var(--border);
    color: var(--gold);
    padding: 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 11px;
    font-weight: bold;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.2;
}

.shot-btn:hover {
    border-color: var(--gold);
    background: rgba(255, 179, 0, 0.1);
    transform: translateY(-2px);
}

.shot-btn:active {
    transform: scale(0.95);
}

.commentary {
    position: fixed;
    bottom: 400px;
    left: 20px;
    width: 350px;
    background: rgba(26, 31, 58, 0.98);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    z-index: 100;
}

.commentary-title {
    color: var(--gold);
    font-weight: bold;
    margin-bottom: 8px;
    font-size: 11px;
    text-transform: uppercase;
}

.commentary-text {
    color: #eee;
    font-size: 12px;
    line-height: 1.5;
    font-style: italic;
    min-height: 60px;
}

.camera-selector {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 200px;
    background: rgba(26, 31, 58, 0.98);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    z-index: 100;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.camera-btn {
    background: var(--card);
    border: 2px solid var(--border);
    color: var(--text-light);
    padding: 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 11px;
    font-weight: bold;
    transition: all 0.2s ease;
    text-align: center;
}

.camera-btn:hover {
    border-color: var(--gold);
    color: var(--gold);
}

.camera-btn.active {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(255, 179, 0, 0.1);
}

.wagon-wheel {
    position: fixed;
    bottom: 250px;
    right: 20px;
    width: 200px;
    height: 200px;
    background: rgba(26, 31, 58, 0.95);
    border: 1px solid var(--border);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 90;
    overflow: hidden;
}

.match-info {
    position: fixed;
    top: 500px;
    right: 10px;
    width: 360px;
    background: rgba(26, 31, 58, 0.95);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    z-index: 100;
}

.info-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    font-size: 12px;
}

.info-row:last-child {
    border-bottom: none;
}

.info-row span:last-child {
    color: var(--gold);
    font-weight: bold;
}

.menu-overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, rgba(10, 14, 39, 0.95), rgba(26, 31, 58, 0.95));
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    backdrop-filter: blur(4px);
}

.menu-overlay.active {
    display: flex;
}

.menu-container {
    text-align: center;
    max-width: 900px;
    width: 90%;
}

.menu-logo {
    margin-bottom: 40px;
}

.menu-logo h1 {
    font-size: 56px;
    color: var(--gold);
    text-shadow: 0 4px 20px rgba(255, 179, 0, 0.4);
    margin-bottom: 10px;
    letter-spacing: 2px;
}

.menu-logo p {
    color: var(--text-light);
    font-size: 14px;
}

.menu-section h2 {
    color: var(--gold);
    margin-bottom: 20px;
    font-size: 18px;
    text-transform: uppercase;
    letter-spacing: 2px;
}

.menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
}

.menu-card {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 25px 15px;
    cursor: pointer;
    transition: all 0.3s ease;
    color: inherit;
    font-family: inherit;
}

.menu-card:hover {
    border-color: var(--gold);
    transform: translateY(-8px);
    box-shadow: 0 15px 40px rgba(255, 179, 0, 0.25);
}

.card-icon {
    font-size: 40px;
    margin-bottom: 10px;
}

.card-title {
    color: var(--gold);
    font-weight: bold;
    margin-bottom: 5px;
    font-size: 14px;
}

.card-desc {
    color: var(--text-light);
    font-size: 11px;
}

@media (max-width: 768px) {
    .scoreboard {
        width: 100%;
        right: 0;
        top: 0;
        border-radius: 0;
    }
    .batsman-info, .bowler-info, .match-info {
        display: none;
    }
    .controls {
        width: calc(100% - 40px);
        bottom: 200px;
    }
    .commentary {
        width: calc(100% - 40px);
        bottom: auto;
        top: 200px;
    }
    .camera-selector {
        width: 100%;
        right: 0;
        bottom: 0;
        border-radius: 10px 10px 0 0;
        flex-direction: row;
    }
    .wagon-wheel {
        display: none;
    }
    .menu-grid {
        grid-template-columns: 1fr 1fr;
    }
}

::-webkit-scrollbar {
    width: 6px;
}

::-webkit-scrollbar-track {
    background: var(--dark);
}

::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
}

::-webkit-scrollbar-thumb:hover {
    background: var(--gold);
}
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="canvas"></canvas>

        <div id="hud" class="hud">
            <div class="scoreboard">

                    </div>
                </div>
            </div>

            <div class="batsman-info">
                <div class="player-card">
                    <div class="player-name" id="batsmanName">-</div>
                    <div class="player-stats">
                        <div class="stat"><span>Runs:</span> <span id="batsmanRuns">0</span></div>
                        <div class="stat"><span>Balls:</span> <span id="batsmanBalls">0</span></div>

            <div class="wagon-wheel">
                <canvas id="wagonWheelCanvas" width="200" height="200"></canvas>

            <div class="match-info">
                <div class="info-row"><span>Inning:</span> <span id="inningNo">1</span></div>

        <div id="menuOverlay" class="menu-overlay active">

                        <button class="menu-card" onclick="window.startGame('t20')">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cannon@0.20.0/build/cannon.js"></script>

    <script>
// ALL GAME CODE BELOW - CONSOLIDATED INTO ONE FILE

const TEAMS = [
    {
        name: "Mumbai Indians",
        emoji: "🔵",
        color: 0x0066ff,
        players: ["Rohit Sharma", "Suryakumar Yadav", "Tilak Varma", "Hardik Pandya", "Naman Dhir", "Robin Minz", "Karn Sharma", "Jasprit Bumrah", "Trent Boult", "Deepak Chahar", "Ashwani Kumar"]
    },
    {
        name: "Chennai Super Kings",
        emoji: "🟡",
        color: 0xffdd00,
        players: ["Ruturaj Gaikwad", "Rachin Ravindra", "Shivam Dube", "MS Dhoni", "Ravindra Jadeja", "Sam Curran", "Matheesha Pathirana", "Deepak Chahar", "Noor Ahmad", "Khaleel Ahmed", "Nathan Ellis"]
    },
    {
        name: "Royal Challengers",
        emoji: "🔴",
        color: 0xff0000,
        players: ["Virat Kohli", "Phil Salt", "Rajat Patidar", "Liam Livingstone", "Jitesh Sharma", "Krunal Pandya", "Swapnil Singh", "Bhuvneshwar Kumar", "Josh Hazlewood", "Yash Dayal", "Suyash Sharma"]
    },
    {
        name: "Kolkata Knight Riders",
        emoji: "🟣",
        color: 0x9932cc,
        players: ["Ajinkya Rahane", "Quinton de Kock", "Venkatesh Iyer", "Andre Russell", "Rinku Singh", "Sunil Narine", "Angkrish Raghuvanshi", "Varun Chakravarthy", "Harshit Rana", "Spencer Johnson", "Anrich Nortje"]
    }
];

let gameInstance = null;

// PHYSICS CLASS
class CricketPhysics {
    constructor() {
        this.ballPosition = new THREE.Vector3(0, 2, -15);
        this.ballVelocity = new THREE.Vector3(0, 0, 0);
        this.ballSpin = new THREE.Vector3(0, 0, 0);
        this.gravity = 9.81;
        this.airResistance = 0.98;
    }
    update(deltaTime) {
        this.ballVelocity.y -= this.gravity * deltaTime;
        this.ballVelocity.multiplyScalar(Math.pow(this.airResistance, deltaTime));
        this.ballPosition.addScaledVector(this.ballVelocity, deltaTime);
        if (this.ballPosition.y <= 0.07) {
            this.ballPosition.y = 0.07;
            this.ballVelocity.y *= -0.6;
        }
        return { bounced: this.ballPosition.y <= 0.07 };
    }
    deliverBall(speed, type = 'fast', line = 0, length = 0.5) {
        const speedMph = 60 + speed * 2;
        const speedMs = speedMph * 0.44704;
        this.ballVelocity.z = speedMs;
        this.ballVelocity.x = line * speedMs * 0.3;
        this.ballVelocity.y = speedMs * (0.2 + length * 0.2);
    }
}

// MODELS CLASS
class ModelFactory {
    static createStadium(scene) {
        const stadiumGroup = new THREE.Group();
        const groundGeo = new THREE.PlaneGeometry(200, 200);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a4d1a, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        stadiumGroup.add(ground);

        const pitchGeo = new THREE.BoxGeometry(3.66, 0.1, 22);
        const pitchMat = new THREE.MeshStandardMaterial({ color: 0x0d3d0d, roughness: 0.9 });
        const pitch = new THREE.Mesh(pitchGeo, pitchMat);
        pitch.position.y = 0.05;
        pitch.castShadow = true;
        stadiumGroup.add(pitch);

        stadiumGroup.add(ModelFactory.createStumps(0, -11));
        stadiumGroup.add(ModelFactory.createStumps(0, 11));
        stadiumGroup.add(ModelFactory.createBoundary());
        return stadiumGroup;
    }
    static createStumps(x, z) {
        const stumpsGroup = new THREE.Group();
        const stumpGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.71, 8);
        const stumpMat = new THREE.MeshStandardMaterial({ color: 0xf5deb3 });
        for (let i = -1; i <= 1; i++) {
            const stump = new THREE.Mesh(stumpGeo, stumpMat);
            stump.position.x = i * 0.35;
            stump.castShadow = true;
            stumpsGroup.add(stump);
        }
        stumpsGroup.position.set(x, 0.35, z);
        return stumpsGroup;
    }
    static createBoundary() {
        const points = [];
        const radius = 45;
        for (let i = 0; i <= 64; i++) {
            const angle = (i / 64) * Math.PI * 2;
            points.push(new THREE.Vector3(Math.cos(angle) * radius, 0.5, Math.sin(angle) * radius));
        }
        const boundaryCurve = new THREE.CatmullRomCurve3(points);
        const boundaryGeo = new THREE.TubeGeometry(boundaryCurve, 64, 0.05, 4, false);
        const boundaryMat = new THREE.MeshStandardMaterial({ color: 0xff6b35 });
        const boundary = new THREE.Mesh(boundaryGeo, boundaryMat);
        return boundary;
    }
    static createPlayer(teamColor, isBatter = true) {
        const playerGroup = new THREE.Group();
        const headGeo = new THREE.SphereGeometry(0.15, 16, 16);
        const headMat = new THREE.MeshStandardMaterial({ color: 0xd4a574, roughness: 0.4 });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.y = 1.7;
        playerGroup.add(head);

        const helmetGeo = new THREE.SphereGeometry(0.18, 16, 16);
        const helmetMat = new THREE.MeshStandardMaterial({ color: teamColor, roughness: 0.3 });
        const helmet = new THREE.Mesh(helmetGeo, helmetMat);
        helmet.position.y = 1.75;
        playerGroup.add(helmet);

        const bodyGeo = new THREE.CylinderGeometry(0.2, 0.18, 0.8, 8);
        const bodyMat = new THREE.MeshStandardMaterial({ color: teamColor, roughness: 0.5 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 1.0;
        playerGroup.add(body);

        const legGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.8, 6);
        const legMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const leftLeg = new THREE.Mesh(legGeo, legMat);
        leftLeg.position.set(-0.12, 0.4, 0);
        playerGroup.add(leftLeg);

        return playerGroup;
    }
    static createBall() {
        const ballGeo = new THREE.SphereGeometry(0.073, 32, 32);
        const ballMat = new THREE.MeshStandardMaterial({ color: 0xff0000, roughness: 0.3 });
        const ball = new THREE.Mesh(ballGeo, ballMat);
        ball.castShadow = true;
        return ball;
    }
    static createWickets() {
        const wicketsGroup = new THREE.Group();
        const stumpGeo = new THREE.CylinderGeometry(0.035, 0.035, 0.71, 6);
        const stumpMat = new THREE.MeshStandardMaterial({ color: 0xf5deb3 });
        for (let i = -1; i <= 1; i++) {
            const stump = new THREE.Mesh(stumpGeo, stumpMat);
            stump.position.x = i * 0.35;
            wicketsGroup.add(stump);
        }
        return wicketsGroup;
    }
}

// SCENE CLASS
class GameScene {
    constructor(canvas) {
        this.canvas = canvas;
        this.scene = new THREE.Scene();
        this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        this.renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        this.setupRenderer();
        this.setupLighting();
        this.createGameObjects();
        window.addEventListener('resize', () => this.onWindowResize());
    }
    setupRenderer() {
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.shadowMap.enabled = true;
        this.renderer.background = new THREE.Color(0x87ceeb);
    }
    setupLighting() {
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        this.scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(100, 100, 100);
        dirLight.castShadow = true;
        this.scene.add(dirLight);
    }
    createGameObjects() {
        this.stadium = ModelFactory.createStadium(this.scene);
        this.scene.add(this.stadium);
        this.batter = ModelFactory.createPlayer(0x0066ff, true);
        this.batter.position.set(0, 0, 1);
        this.scene.add(this.batter);
        this.bowler = ModelFactory.createPlayer(0xffdd00, false);
        this.bowler.position.set(0, 0, -10);
        this.scene.add(this.bowler);
        this.ball = ModelFactory.createBall();
        this.ball.position.set(0, 2, -15);
        this.scene.add(this.ball);
    }
    getCamera() { return this.camera; }
    getScene() { return this.scene; }
    setBallPosition(x, y, z) { this.ball.position.set(x, y, z); }
    render() { this.renderer.render(this.scene, this.camera); }
    onWindowResize() {
        this.camera.aspect = window.innerWidth / window.innerHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(window.innerWidth, window.innerHeight);
    }
}

// CAMERA CLASS
class CameraSystem {
    constructor(camera, scene) {
        this.camera = camera;
        this.scene = scene;
        this.currentCamera = 'broadcast';
        this.cameraTarget = new THREE.Vector3(0, 1, 0);
        this.cameraPosition = new THREE.Vector3(0, 10, 20);
        this.smoothing = 0.08;
    }
    setCamera(type) {
        this.currentCamera = type;
        this.updateCameraPosition();
        document.querySelectorAll('.camera-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
    }
    updateCameraPosition() {
        const targetPos = new THREE.Vector3(0, 1, 0);
        switch (this.currentCamera) {
            case 'broadcast':
                this.cameraPosition.set(0, 12, 25);
                break;
            case 'batting':
                this.cameraPosition.set(-4, 1.5, 2);
                break;
            case 'bowling':
                this.cameraPosition.set(0, 2, -18);
                break;
            case 'stump':
                this.cameraPosition.set(2, 1.2, -0.5);
                break;
        }
        this.cameraTarget = targetPos;
    }
    updateCamera() {
        this.camera.position.lerp(this.cameraPosition, this.smoothing);
        this.camera.lookAt(this.cameraTarget);
    }
}

    decideBowlingDelivery(matchState) {

// INPUT CLASS
class InputManager {
    constructor() { this.setupEventListeners(); }

        document.addEventListener('keydown', (e) => {

// GAME CLASS
class CricketGame {
    constructor() {
        this.matchState = {
            mode: 't20', maxOvers: 20, inning: 1, balls: 0, score: 0, wickets: 0,
            runs: 0, striker: 0, nonStriker: 1, bowler: 0, target: null,
            batStats: [], bowlStats: [], opposition: { score: 0, wickets: 0, balls: 0 },
            team1: null, team2: null, isGameActive: false
        };
        this.physics = new CricketPhysics();
        this.ai = new CricketAI();
        this.ui = new UIManager();
        this.input = new InputManager();
        this.animationController = new AnimationController();
        this.ballInPlay = false;
        window.gameInstance = this;
    }
    initMatch(mode, team1, team2) {
        this.matchState.mode = mode;
        this.matchState.team1 = team1;
        this.matchState.team2 = team2;
        this.matchState.maxOvers = { quick: 5, t20: 20, odi: 50, test: 15 }[mode];
        this.matchState.batStats = team1.players.map(name => ({ name, runs: 0, balls: 0, fours: 0, sixes: 0, out: false }));
        this.matchState.bowlStats = team2.players.map(name => ({ name, balls: 0, runs: 0, wickets: 0 }));
        this.matchState.isGameActive = true;
        this.ui.updateAll(this.matchState);
        this.ui.hideMenu();
    }
    playShot(shotIdx) {
        if (!this.matchState.isGameActive) return;
        const shots = [
            { name: 'Cover Drive', power: 0.85, angle: 45 },
            { name: 'Straight Drive', power: 0.90, angle: 0 },
            { name: 'Flick', power: 0.65, angle: -30 },
            { name: 'Pull', power: 0.95, angle: 90 },
            { name: 'Hook', power: 1.0, angle: 85 },
            { name: 'Cut', power: 0.80, angle: 60 },
            { name: 'Sweep', power: 0.70, angle: -60 },
            { name: 'Reverse Sweep', power: 0.60, angle: -45 },
            { name: 'Upper Cut', power: 0.85, angle: 70 },
            { name: 'Lofted Drive', power: 0.80, angle: 30 },
            { name: 'Paddle Sweep', power: 0.55, angle: -50 },
            { name: 'Ramp', power: 0.65, angle: -20 },
            { name: 'Helicopter', power: 0.95, angle: 50 },
            { name: 'Defend', power: 0.30, angle: 0 },
            { name: 'Drop', power: 0.15, angle: 0 }
        ];
        const shot = shots[shotIdx];
        if (!shot) return;
        this.calculateBallResult(shot);
        this.ui.addCommentary(`${this.matchState.batStats[this.matchState.striker].name} plays ${shot.name}`);
        this.ui.updateAll(this.matchState);
        this.checkGameEnd();
    }
    calculateBallResult(shot) {
        const batter = this.matchState.batStats[this.matchState.striker];
        const power = Math.random();
        const timing = Math.random() + 0.3;
        const quality = power * timing * shot.power;
        let runs = 0;
        let isWicket = false;
        if (Math.random() < 0.12 * (1 - timing)) {
            isWicket = true;
            this.matchState.wickets++;
            batter.out = true;
            this.ui.addCommentary(`WICKET! ${batter.name} is out!`);
        } else {
            if (quality > 0.9) {
                runs = 6;
                batter.sixes++;
                this.ui.addCommentary(`SIX! ${shot.name}!`);
            } else if (quality > 0.7) {
                runs = 4;
                batter.fours++;
                this.ui.addCommentary(`FOUR!`);
            } else if (quality > 0.5) {
                runs = 2;
            } else if (quality > 0.3) {
                runs = 1;
            }
            this.matchState.score += runs;
            batter.runs += runs;
            if (runs % 2 === 1) {
                [this.matchState.striker, this.matchState.nonStriker] = [this.matchState.nonStriker, this.matchState.striker];
            }
        }
        this.matchState.balls++;
    }
    checkGameEnd() {
        if (this.matchState.balls >= this.matchState.maxOvers * 6 || this.matchState.wickets >= 10) {
            this.endInning();
        }
    }
    endInning() {
        this.matchState.inning = 2;
        this.matchState.balls = 0;
        this.matchState.wickets = 0;
        this.matchState.score = 0;
        this.ui.addCommentary(`End of Inning 1`);
    }
    update(deltaTime) {
        if (!this.matchState.isGameActive) return;
    }
    render() {
        if (this.scene) this.scene.render();
    }
}

// INITIALIZATION
function initGame() {
    console.log('🏏 Initializing Cricket Champions 3D...');
    const canvas = document.getElementById('canvas');
    gameInstance = new CricketGame();
    gameInstance.scene = new GameScene(canvas);
    gameInstance.camera = gameInstance.scene.getCamera();
    gameInstance.camera = new CameraSystem(gameInstance.camera, gameInstance.scene.getScene());
    gameInstance.ui.init();
    startGameLoop();
}

function startGame(mode) {
    console.log(`Starting ${mode} match...`);
    const team1 = TEAMS[0];
    const team2 = TEAMS[1];
    gameInstance.initMatch(mode, team1, team2);
    gameInstance.ui.updateAll(gameInstance.matchState);
}

let lastTime = Date.now();
function gameLoop() {
    const now = Date.now();
    const deltaTime = (now - lastTime) / 1000;
    lastTime = now;
    const clampedDelta = Math.min(deltaTime, 0.033);
    gameInstance.update(clampedDelta);
    if (gameInstance.camera) gameInstance.camera.updateCamera();
    gameInstance.render();
    requestAnimationFrame(gameLoop);
}

function startGameLoop() {
    lastTime = Date.now();
    gameLoop();
}

// START ON LOAD
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initGame);
} else {
    initGame();
}
