<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Bird Crossing</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      user-select: none;
    }
    #gameContainer { position: relative; }
    canvas {
      display: block;
      border: 3px solid #e94560;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(233,69,96,0.5);
    }
    #hud {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      pointer-events: none;
      color: white;
      font-size: 18px;
      font-weight: bold;
      text-shadow: 1px 1px 4px #000;
    }
    #lives { color: #ff6b6b; font-size: 22px; }
    #score { font-size: 22px; }
    #best  { color: #ffd700; font-size: 16px; }
    #overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.78);
      border-radius: 5px;
    }
    #overlay h1 { color: #e94560; font-size: 40px; margin-bottom: 6px; text-shadow: 0 0 20px rgba(233,69,96,0.9); }
    #overlay h2 { color: #ffd700; font-size: 22px; margin-bottom: 20px; }
    .hint { color: #bbb; font-size: 14px; margin: 3px 0; }
    #finalScore { color: white; font-size: 18px; margin-top: 14px; }
    #playBtn {
      margin-top: 22px; padding: 13px 44px;
      font-size: 20px; font-weight: bold;
      background: linear-gradient(135deg,#e94560,#c62a47);
      color: white; border: none; border-radius: 50px;
      cursor: pointer; box-shadow: 0 4px 15px rgba(233,69,96,0.45);
      transition: transform 0.1s;
    }
    #playBtn:hover { transform: translateY(-2px); }
    #controls {
      display: flex; gap: 8px; margin-top: 18px;
    }
    .dpad {
      width: 52px; height: 52px; font-size: 22px;
      background: rgba(255,255,255,0.15); border: none;
      border-radius: 10px; color: white; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      touch-action: manipulation;
    }
    .dpad:active { background: rgba(255,255,255,0.35); }
  </style>
</head>
<body>
<div id="gameContainer">
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="lives">❤️❤️❤️</div>
    <div id="score">0</div>
    <div id="best">BEST: 0</div>
  </div>
  <div id="overlay">
    <h1>🐦 Bird Crossing</h1>
    <h2>Cross all 4 roads safely!</h2>
    <p class="hint">Arrow keys / WASD to move</p>
    <p class="hint">Avoid cars — you have 3 lives</p>
    <p class="hint">Reach the safe zone to score a point!</p>
    <div id="finalScore"></div>
    <button id="playBtn">PLAY</button>
  </div>
</div>
<div id="controls">
  <button class="dpad" id="btnL">◀</button>
  <div style="display:flex;flex-direction:column;gap:8px">
    <button class="dpad" id="btnU">▲</button>
    <button class="dpad" id="btnD">▼</button>
  </div>
  <button class="dpad" id="btnR">▶</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const COLS = 9, ROWS = 9;
const CELL = 60;
const W = COLS * CELL, H = ROWS * CELL;
canvas.width = W; canvas.height = H;
document.getElementById('gameContainer').style.width = W + 'px';

// Row layout (row 0 = top, row 8 = bottom)
// row 0: safe zone (goal)
// rows 1-4: roads (4 lanes of traffic)
// row 5: divider / safe strip
// rows 6-7: more roads (optional extra challenge strip – used as pavement)
// row 8: start / safe zone
// Actually: row 0=goal, 1-4=road lanes, 5=median, 6-7=more roads skipped, 8=start
// Simplified: 4 road rows between start and goal

const ROW_TYPES = [
  'goal',    // 0
  'road',    // 1
  'road',    // 2
  'road',    // 3
  'road',    // 4
  'median',  // 5
  'sidewalk',// 6
  'sidewalk',// 7
  'start',   // 8
];

// Road colours
const COLORS = {
  goal:      '#2d6a4f',
  road:      '#333',
  median:    '#555',
  sidewalk:  '#8d6e63',
  start:     '#2d6a4f',
  line:      '#fff',
  grass:     '#40916c',
};

// Traffic lanes config (rows 1-4)
const LANES = [
  { row: 1, dir: 1,  speed: 2.2, carW: 80, carH: 36, color: '#e63946', count: 2 },
  { row: 2, dir: -1, speed: 2.8, carW: 70, carH: 36, color: '#457b9d', count: 3 },
  { row: 3, dir: 1,  speed: 1.8, carW: 90, carH: 36, color: '#f4a261', count: 2 },
  { row: 4, dir: -1, speed: 3.2, carW: 65, carH: 36, color: '#8338ec', count: 3 },
];

let cars = [];
let bird, state, score, highScore, lives, frameCount;
let particles = [];
let deathTimer = 0;

function initCars() {
  cars = [];
  LANES.forEach(lane => {
    const spacing = (W + lane.carW) / lane.count;
    for (let i = 0; i < lane.count; i++) {
      cars.push({
        lane,
        x: (lane.dir === 1 ? -lane.carW + i * spacing : W + i * spacing),
        y: lane.row * CELL + (CELL - lane.carH) / 2,
        w: lane.carW,
        h: lane.carH,
      });
    }
  });
}

function initBird() {
  bird = {
    col: Math.floor(COLS / 2),
    row: 8,
    px: 0, py: 0,       // pixel offset for animation
    moving: false,
    moveTimer: 0,
    targetCol: Math.floor(COLS / 2),
    targetRow: 8,
    invincible: 0,
    wobble: 0,
  };
}

function resetGame() {
  score = 0; lives = 3; frameCount = 0;
  initCars(); initBird(); particles = [];
  updateHUD();
}

function updateHUD() {
  document.getElementById('score').textContent = score;
  document.getElementById('lives').textContent = '❤️'.repeat(lives) || '💀';
  document.getElementById('best').textContent = 'BEST: ' + highScore;
}

// ---- Input ----
let pendingMove = null;
const MOVE_FRAMES = 7;

function tryMove(dc, dr) {
  if (state !== 'playing') return;
  if (bird.moving) return;
  const nc = bird.col + dc;
  const nr = bird.row + dr;
  if (nc < 0 || nc >= COLS || nr < 0 || nr >= ROWS) return;
  bird.targetCol = nc;
  bird.targetRow = nr;
  bird.moving = true;
  bird.moveTimer = MOVE_FRAMES;
  bird.wobble = dr < 0 ? -1 : (dr > 0 ? 1 : 0);
}

document.addEventListener('keydown', e => {
  const map = { ArrowUp:'u', ArrowDown:'d', ArrowLeft:'l', ArrowRight:'r',
                w:'u', s:'d', a:'l', d:'r', W:'u', S:'d', A:'l', D:'r' };
  const dir = map[e.key];
  if (dir) { e.preventDefault(); handleDir(dir); }
});
document.getElementById('btnU').addEventListener('click', () => handleDir('u'));
document.getElementById('btnD').addEventListener('click', () => handleDir('d'));
document.getElementById('btnL').addEventListener('click', () => handleDir('l'));
document.getElementById('btnR').addEventListener('click', () => handleDir('r'));

function handleDir(dir) {
  if (state === 'idle' || state === 'dead') { startGame(); return; }
  if (dir === 'u') tryMove(0, -1);
  if (dir === 'd') tryMove(0,  1);
  if (dir === 'l') tryMove(-1, 0);
  if (dir === 'r') tryMove( 1, 0);
}

document.getElementById('playBtn').addEventListener('click', startGame);

function startGame() {
  resetGame();
  state = 'playing';
  document.getElementById('overlay').style.display = 'none';
}

// ---- Update ----
function update() {
  if (state !== 'playing') return;
  frameCount++;

  // Move cars
  cars.forEach(car => {
    car.x += car.lane.dir * car.lane.speed;
    if (car.lane.dir === 1 && car.x > W + 10) car.x = -car.w - 10;
    if (car.lane.dir === -1 && car.x < -car.w - 10) car.x = W + 10;
  });

  // Bird movement animation
  if (bird.moving) {
    bird.moveTimer--;
    const t = 1 - bird.moveTimer / MOVE_FRAMES;
    bird.px = (bird.targetCol - bird.col) * CELL * t;
    bird.py = (bird.targetRow - bird.row) * CELL * t;
    if (bird.moveTimer <= 0) {
      bird.col = bird.targetCol;
      bird.row = bird.targetRow;
      bird.px = 0; bird.py = 0;
      bird.moving = false;
    }
  }

  if (bird.invincible > 0) bird.invincible--;

  // Check goal
  if (bird.row === 0) {
    score++;
    if (score > highScore) highScore = score;
    spawnParticles(birdPixelX(), birdPixelY(), '#ffd700', 20);
    updateHUD();
    bird.row = 8;
    bird.col = Math.floor(COLS / 2);
    bird.targetRow = 8; bird.targetCol = Math.floor(COLS / 2);
  }

  // Collision with cars
  if (!bird.moving && bird.invincible === 0 && ROW_TYPES[bird.row] === 'road') {
    const bx = bird.col * CELL + CELL / 2;
    const by = bird.row * CELL + CELL / 2;
    const br = 18;
    for (const car of cars) {
      if (car.lane.row !== bird.row) continue;
      if (bx + br > car.x + 6 && bx - br < car.x + car.w - 6 &&
          by + br > car.y + 4 && by - br < car.y + car.h - 4) {
        hitBird();
        break;
      }
    }
  }

  // Particles
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life -= 0.025; });
  particles = particles.filter(p => p.life > 0);
}

function birdPixelX() { return bird.col * CELL + bird.px + CELL / 2; }
function birdPixelY() { return bird.row * CELL + bird.py + CELL / 2; }

function spawnParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = (Math.PI * 2 * i) / n;
    const sp = 1.5 + Math.random() * 3;
    particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 2, life: 1, color, size: 3 + Math.random()*3 });
  }
}

function hitBird() {
  spawnParticles(birdPixelX(), birdPixelY(), '#ff4444', 18);
  lives--;
  updateHUD();
  bird.invincible = 100;
  bird.row = 8; bird.col = Math.floor(COLS / 2);
  bird.targetRow = 8; bird.targetCol = Math.floor(COLS / 2);
  bird.px = 0; bird.py = 0; bird.moving = false;
  if (lives <= 0) {
    state = 'gameover';
    showOverlay('💀 Game Over', 'You got run over!', `Score: ${score}  |  Best: ${highScore}`, 'PLAY AGAIN');
  }
}

function showOverlay(h1, h2, fs, btn) {
  const ov = document.getElementById('overlay');
  ov.style.display = 'flex';
  ov.querySelector('h1').textContent = h1;
  ov.querySelector('h2').textContent = h2;
  document.getElementById('finalScore').textContent = fs;
  document.getElementById('playBtn').textContent = btn;
}

// ---- Draw ----

function drawRoad(row) {
  ctx.fillStyle = COLORS.road;
  ctx.fillRect(0, row * CELL, W, CELL);
  // Dashed center line
  ctx.strokeStyle = 'rgba(255,255,200,0.3)';
  ctx.lineWidth = 2;
  ctx.setLineDash([20, 20]);
  ctx.lineDashOffset = -(frameCount * 1.5) % 40;
  ctx.beginPath();
  ctx.moveTo(0, row * CELL + CELL / 2);
  ctx.lineTo(W, row * CELL + CELL / 2);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.lineDashOffset = 0;
}

function drawRow(row) {
  const type = ROW_TYPES[row];
  if (type === 'road') { drawRoad(row); return; }
  if (type === 'goal') {
    ctx.fillStyle = '#1b4332';
    ctx.fillRect(0, row * CELL, W, CELL);
    ctx.fillStyle = '#40916c';
    for (let c = 0; c < COLS; c++) {
      if (c % 2 === 0) ctx.fillRect(c * CELL, row * CELL, CELL, CELL);
    }
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 28px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🏁 SAFE ZONE', W / 2, row * CELL + CELL / 2);
    return;
  }
  if (type === 'start') {
    ctx.fillStyle = '#1b4332';
    ctx.fillRect(0, row * CELL, W, CELL);
    ctx.fillStyle = '#40916c';
    for (let c = 0; c < COLS; c++) {
      if (c % 2 === 0) ctx.fillRect(c * CELL, row * CELL, CELL, CELL);
    }
    return;
  }
  if (type === 'median') {
    ctx.fillStyle = '#4a4a4a';
    ctx.fillRect(0, row * CELL, W, CELL);
    ctx.fillStyle = '#5a5a5a';
    for (let x = 0; x < W; x += 30) {
      ctx.fillRect(x, row * CELL + CELL / 2 - 3, 18, 6);
    }
    return;
  }
  if (type === 'sidewalk') {
    ctx.fillStyle = '#795548';
    ctx.fillRect(0, row * CELL, W, CELL);
    // Tile pattern
    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += CELL) {
      ctx.beginPath(); ctx.moveTo(x, row * CELL); ctx.lineTo(x, (row+1)*CELL); ctx.stroke();
    }
    return;
  }
}

function drawCar(car) {
  const r = 6;
  const x = car.x, y = car.y, w = car.w, h = car.h;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(x + w/2, y + h + 4, w/2 - 4, 5, 0, 0, Math.PI*2);
  ctx.fill();

  // Body
  ctx.fillStyle = car.lane.color;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
  ctx.fill();

  // Roof
  const roofX = x + w * 0.2, roofW = w * 0.6, roofH = h * 0.42;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.moveTo(roofX + 6, y + h * 0.1);
  ctx.lineTo(roofX + roofW - 6, y + h * 0.1);
  ctx.lineTo(roofX + roofW, y + h * 0.1 + roofH);
  ctx.lineTo(roofX, y + h * 0.1 + roofH);
  ctx.closePath();
  ctx.fill();

  // Windows
  ctx.fillStyle = 'rgba(180,230,255,0.7)';
  ctx.fillRect(roofX + 4, y + h * 0.12, roofW * 0.42, roofH - 4);
  ctx.fillRect(roofX + roofW * 0.54, y + h * 0.12, roofW * 0.42, roofH - 4);

  // Wheels
  ctx.fillStyle = '#222';
  const wr = 7, wy = y + h - 2;
  [x + 12, x + w - 12].forEach(wx => {
    ctx.beginPath(); ctx.arc(wx, wy, wr, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#888'; ctx.beginPath(); ctx.arc(wx, wy, 3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#222';
  });

  // Headlights / tail lights
  const isRight = car.lane.dir === 1;
  ctx.fillStyle = isRight ? '#ffff88' : '#ff4444';
  ctx.fillRect(isRight ? x + w - 6 : x + 2, y + 6, 4, 8);
  ctx.fillRect(isRight ? x + w - 6 : x + 2, y + h - 14, 4, 8);
  ctx.fillStyle = isRight ? '#ff4444' : '#ffff88';
  ctx.fillRect(isRight ? x + 2 : x + w - 6, y + 6, 4, 8);
  ctx.fillRect(isRight ? x + 2 : x + w - 6, y + h - 14, 4, 8);
}

function drawBird() {
  const bx = birdPixelX();
  const by = birdPixelY();

  ctx.save();
  ctx.translate(bx, by);

  // Invincible flicker
  if (bird.invincible > 0 && Math.floor(bird.invincible / 5) % 2 === 1) {
    ctx.globalAlpha = 0.3;
  }

  // Hop arc when moving up
  let hopY = 0;
  if (bird.moving && bird.targetRow < bird.col) {
    const t = 1 - bird.moveTimer / MOVE_FRAMES;
    hopY = -Math.sin(t * Math.PI) * 10;
  }
  ctx.translate(0, hopY);

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(0, 20, 14, 5, 0, 0, Math.PI*2);
  ctx.fill();

  // Body glow
  ctx.shadowColor = '#ffdd57';
  ctx.shadowBlur = 10;

  // Body
  const grad = ctx.createRadialGradient(-5, -5, 2, 0, 0, 22);
  grad.addColorStop(0, '#ffe066');
  grad.addColorStop(0.5, '#f9a825');
  grad.addColorStop(1, '#e65100');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.ellipse(0, 0, 20, 17, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Wing flap animation
  const flap = Math.sin(frameCount * 0.25) * 0.35;
  ctx.save();
  ctx.rotate(flap);
  ctx.fillStyle = '#e65100';
  ctx.beginPath();
  ctx.ellipse(-5, 3, 13, 7, -0.3, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // Eye
  ctx.fillStyle = 'white';
  ctx.beginPath(); ctx.arc(8, -5, 6, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(10, -5, 3, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'white';
  ctx.beginPath(); ctx.arc(11, -6, 1, 0, Math.PI*2); ctx.fill();

  // Beak
  ctx.fillStyle = '#ff7043';
  ctx.beginPath();
  ctx.moveTo(16, -1); ctx.lineTo(24, 2); ctx.lineTo(16, 5);
  ctx.closePath(); ctx.fill();

  // Feet
  ctx.strokeStyle = '#e65100';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  const fStep = bird.moving ? Math.sin(frameCount * 0.4) * 4 : 0;
  ctx.beginPath(); ctx.moveTo(-6, 16); ctx.lineTo(-6 - fStep, 22); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( 6, 16); ctx.lineTo( 6 + fStep, 22); ctx.stroke();

  ctx.restore();
}

function drawParticles() {
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color; ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  });
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Draw all rows
  for (let r = 0; r < ROWS; r++) drawRow(r);

  // Road borders
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.lineWidth = 1;
  for (let r = 1; r <= 4; r++) {
    ctx.strokeRect(0, r * CELL, W, CELL);
  }

  // Cars
  cars.forEach(drawCar);

  // Particles
  drawParticles();

  // Bird
  drawBird();

  // Score popup on goal row
  if (bird.row === 8 && score > 0) {
    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 16px Arial';
    ctx.textAlign = 'left';
    ctx.fillText(`✅ Crossed! Score: ${score}`, 10, (ROWS - 1) * CELL + CELL / 2 + 6);
    ctx.restore();
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// Init
state = 'idle';
score = 0; highScore = 0; lives = 3;
initCars(); initBird(); frameCount = 0;
updateHUD();
loop();
</script>
</body>
</html>
