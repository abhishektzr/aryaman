<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cricket Champions</title>
  <style>
    :root { --gold: #ffb300; --orange: #ff6b35; --bg: #0e1117; --card: #222936; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: #eee; font-family: Arial, sans-serif; }
    .screen { position: fixed; inset: 0; display: none; flex-direction: column; justify-content: center; align-items: center; }
    .screen.active { display: flex; }
    h1 { color: var(--gold); font-size: 50px; margin-bottom: 30px; }
    .card { background: var(--card); border: 2px solid #444; border-radius: 15px; padding: 40px; text-align: center; cursor: pointer; transition: 0.2s; max-width: 300px; }
    .card:hover { border-color: var(--gold); transform: scale(1.05); }
    .card-emoji { font-size: 60px; margin-bottom: 15px; }
    .card-title { font-size: 24px; font-weight: bold; color: var(--gold); }
    #gameScreen { padding: 0; }
    #cv { position: fixed; inset: 0; width: 100vw; height: 100vh; background: #5aa9e0; }
    .hud { position: fixed; color: white; font-weight: bold; text-shadow: 0 2px 4px black; z-index: 10; font-size: 18px; }
    #hudTL { top: 15px; left: 15px; }
    #hudScore { color: var(--gold); font-size: 28px; }
    #hudOvers { margin-top: 5px; }
    #commentary { position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%); text-align: center; color: var(--gold); font-style: italic; z-index: 10; max-width: 80%; }
    #controls { position: fixed; bottom: 0; left: 0; right: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 8px; background: rgba(0,0,0,0.7); z-index: 20; }
    .ctl { background: var(--card); border: 2px solid #444; border-radius: 8px; padding: 12px 6px; text-align: center; cursor: pointer; font-size: 11px; color: var(--gold); font-weight: bold; transition: 0.1s; }
    .ctl:active { transform: scale(0.95); border-color: var(--gold); }
    .ctl .em { font-size: 20px; }
  </style>
</head>
<body>
  <div class="screen active" id="homeScreen">
    <h1>🏏 CRICKET CHAMPIONS</h1>
    <div class="card" onclick="startGame()">
      <div class="card-emoji">⚡</div>
      <div class="card-title">QUICK MATCH</div>
      <p style="color: #888; margin-top: 10px; font-size: 14px;">T20 • 6 Overs</p>
    </div>
  </div>

  <div class="screen" id="gameScreen">
    <canvas id="cv"></canvas>
    <div class="hud" id="hudTL">
      <div id="hudScore">0/0</div>
      <div id="hudOvers">0.0 ov</div>
    </div>
    <div id="commentary">Match starting...</div>
    <div id="controls"></div>
  </div>

  <script>
    const state = {
      balls: 0, score: 0, wkts: 0, striker: 0, batStats: [],
      maxOvers: 6, gameActive: true, lastCommentary: ''
    };

    const teams = [
      { name: "Mumbai Indians", emoji: "🔵", players: ["Rohit", "Suryakumar", "Tilak", "Hardik", "Naman", "Robin", "Karn", "Bumrah", "Trent", "Deepak", "Ashwani"] },
      { name: "Chennai Super Kings", emoji: "🟡", players: ["Ruturaj", "Rachin", "Shivam", "Dhoni", "Jadeja", "Curran", "Pathirana", "Deepak", "Ahmad", "Khaleel", "Ellis"] },
      { name: "Kolkata Knight Riders", emoji: "🟣", players: ["Rahane", "Quinton", "Venkatesh", "Russell", "Rinku", "Narine", "Raghuvanshi", "Varun", "Rana", "Johnson", "Nortje"] }
    ];

    class Renderer {
      constructor() {
        this.canvas = document.getElementById('cv');
        this.ctx = this.canvas.getContext('2d');
        this.dpr = window.devicePixelRatio || 1;
        this.resize();
        window.addEventListener('resize', () => this.resize());
      }
      resize() {
        this.W = window.innerWidth;
        this.H = window.innerHeight;
        this.canvas.width = this.W * this.dpr;
        this.canvas.height = this.H * this.dpr;
        this.canvas.style.width = this.W + 'px';
        this.canvas.style.height = this.H + 'px';
        this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      }
      draw() {
        this.ctx.clearRect(0, 0, this.W, this.H);

        // Sky
        const skyGrad = this.ctx.createLinearGradient(0, 0, 0, this.H * 0.25);
        skyGrad.addColorStop(0, '#3a7bd5');
        skyGrad.addColorStop(1, '#8ec5e8');
        this.ctx.fillStyle = skyGrad;
        this.ctx.fillRect(0, 0, this.W, this.H * 0.25);

        // Ground
        const groundGrad = this.ctx.createLinearGradient(0, this.H * 0.25, 0, this.H);
        groundGrad.addColorStop(0, '#2e8b3d');
        groundGrad.addColorStop(1, '#3fae53');
        this.ctx.fillStyle = groundGrad;
        this.ctx.fillRect(0, this.H * 0.25, this.W, this.H * 0.75);

        // Pitch
        this.ctx.strokeStyle = '#fff';
        this.ctx.lineWidth = 3;
        this.ctx.beginPath();
        this.ctx.ellipse(this.W / 2, this.H * 0.55, this.W * 0.45, this.H * 0.3, 0, 0, Math.PI * 2);
        this.ctx.stroke();
      }
    }

    class Game {
      constructor() {
        this.renderer = new Renderer();
        this.t1 = teams[Math.floor(Math.random() * teams.length)];
        this.t2 = teams.find(t => t !== this.t1) || teams[0];
        this.ballCount = 0;
      }

      start() {
        state.batStats = this.t1.players.map(name => ({ name, r: 0, b: 0 }));
        setComment(`${this.t1.name} ${this.t1.emoji} batting!`);

        document.getElementById('homeScreen').classList.remove('active');
        document.getElementById('gameScreen').classList.add('active');

        this.buildControls();
        this.loop();
      }

      buildControls() {
        const html = `
          <div class="ctl" onclick="game.play('DEFEND')"><div class="em">🛡️</div><div>DEFEND</div></div>
          <div class="ctl" onclick="game.play('DRIVE')"><div class="em">🏏</div><div>DRIVE</div></div>
          <div class="ctl" onclick="game.play('CUT')"><div class="em">✂️</div><div>CUT</div></div>
          <div class="ctl" onclick="game.play('LOFT')"><div class="em">🚀</div><div>LOFT</div></div>
        `;
        document.getElementById('controls').innerHTML = html;
      }

      play(shot) {
        if (!state.gameActive) return;

        let runs = 0;
        const rand = Math.random();

        if (shot === 'DEFEND') runs = rand > 0.7 ? 1 : 0;
        else if (shot === 'DRIVE') runs = rand > 0.5 ? 2 : (rand > 0.8 ? 4 : 1);
        else if (shot === 'CUT') runs = rand > 0.6 ? 2 : (rand > 0.85 ? 4 : 1);
        else if (shot === 'LOFT') runs = rand > 0.4 ? (rand > 0.7 ? 6 : 4) : (rand > 0.8 ? 1 : 0);

        const isWicket = Math.random() < 0.08;

        if (isWicket) {
          state.wkts++;
          state.striker = Math.min(state.striker + 1, 10);
          setComment(`WICKET! ${this.t1.players[state.striker - 1]} out!`);
        } else {
          state.score += runs;
          if (runs === 4) setComment(`FOUR! Great shot!`);
          else if (runs === 6) setComment(`SIX! Massive!`);
          else if (runs === 0) setComment(`Dot ball`);
          else setComment(`${runs} runs`);
        }

        state.balls++;
        updateHUD();

        if (state.balls >= state.maxOvers * 6 || state.wkts >= 10) {
          state.gameActive = false;
          setTimeout(() => {
            alert(`🏁 Match Over!\n\n${this.t1.name} ${this.t1.emoji}\nScore: ${state.score}/${state.wkts}\nOvers: ${Math.floor(state.balls/6)}.${state.balls%6}`);
            location.reload();
          }, 500);
        }
      }

      loop() {
        this.renderer.draw();
        requestAnimationFrame(() => this.loop());
      }
    }

    function setComment(text) {
      document.getElementById('commentary').textContent = text;
      state.lastCommentary = text;
    }

    function updateHUD() {
      document.getElementById('hudScore').textContent = state.score + '/' + state.wkts;
      document.getElementById('hudOvers').textContent = Math.floor(state.balls / 6) + '.' + (state.balls % 6) + ' ov';
    }

    let game;
    function startGame() {
      game = new Game();
      game.start();
    }

    window.startGame = startGame;
  </script>
</body>
</html>
