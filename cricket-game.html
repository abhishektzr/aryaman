<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏏 Cricket 3D - Professional Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e27;
            color: #fff;
            overflow: hidden;
            width: 100%;
            height: 100vh;
        }

        #gameContainer {
            width: 100%;
            height: 100%;
            position: relative;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .hud {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
        }

        .hud > * {
            pointer-events: all;
        }

        .scoreboard {
            position: fixed;
            top: 10px;
            right: 10px;
            width: 360px;
            background: rgba(26, 31, 58, 0.98);
            border: 2px solid #ffb300;
            border-radius: 12px;
            padding: 15px;
            z-index: 100;
        }

        .score-value {
            font-size: 32px;
            font-weight: bold;
            color: #ffb300;
        }

        .controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 350px;
            background: rgba(26, 31, 58, 0.98);
            border: 1px solid #2a3f5f;
            border-radius: 10px;
            padding: 12px;
            z-index: 100;
        }

        .controls-title {
            color: #ffb300;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .shot-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .shot-btn {
            background: #1a1f3a;
            border: 2px solid #2a3f5f;
            color: #ffb300;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .shot-btn:hover {
            border-color: #ffb300;
            background: rgba(255, 179, 0, 0.1);
        }

        .commentary {
            position: fixed;
            bottom: 400px;
            left: 20px;
            width: 350px;
            background: rgba(26, 31, 58, 0.98);
            border: 1px solid #2a3f5f;
            border-radius: 10px;
            padding: 12px;
            z-index: 100;
        }

        .commentary-text {
            color: #fff;
            font-size: 12px;
            line-height: 1.5;
            min-height: 60px;
        }

        .camera-selector {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 200px;
            background: rgba(26, 31, 58, 0.98);
            border: 1px solid #2a3f5f;
            border-radius: 10px;
            padding: 10px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .camera-btn {
            background: #1a1f3a;
            border: 2px solid #2a3f5f;
            color: #9aa3b2;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .camera-btn:hover {
            border-color: #ffb300;
            color: #ffb300;
        }

        .camera-btn.active {
            border-color: #ffb300;
            color: #ffb300;
            background: rgba(255, 179, 0, 0.1);
        }

        .menu-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 14, 39, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .menu-overlay.hidden {
            display: none;
        }

        .menu-container {
            text-align: center;
        }

        .menu-logo h1 {
            font-size: 56px;
            color: #ffb300;
            margin-bottom: 20px;
            text-shadow: 0 4px 20px rgba(255, 179, 0, 0.4);
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 150px);
            gap: 20px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .menu-card {
            background: #1a1f3a;
            border: 2px solid #2a3f5f;
            border-radius: 12px;
            padding: 25px 15px;
            cursor: pointer;
            transition: all 0.3s;
            color: #fff;
        }

        .menu-card:hover {
            border-color: #ffb300;
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(255, 179, 0, 0.25);
        }

        .card-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .card-title {
            color: #ffb300;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .error-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(239, 68, 68, 0.9);
            color: #fff;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            z-index: 2000;
            max-width: 500px;
            display: none;
        }

        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="canvas"></canvas>

        <div id="hud" class="hud">
            <div class="scoreboard">
                <div style="text-align: center; margin-bottom: 10px;">
                    <span id="team1Name" style="color: #ffb300;">Team 1</span>
                    <span style="margin: 0 10px;">vs</span>
                    <span id="team2Name" style="color: #ffb300;">Team 2</span>
                </div>
                <div style="display: flex; gap: 15px;">
                    <div style="flex: 1; text-align: center;">
                        <div class="score-value" id="team1Score">0/0</div>
                        <div style="font-size: 12px; color: #9aa3b2;" id="team1Overs">0.0 ov</div>
                    </div>
                    <div style="width: 1px; background: #2a3f5f;"></div>
                    <div style="flex: 1; text-align: center;">
                        <div class="score-value" id="team2Score">0/0</div>
                        <div style="font-size: 12px; color: #9aa3b2;" id="team2Overs">0.0 ov</div>
                    </div>
                </div>
            </div>

            <div class="controls">
                <div class="controls-title">⚾ BATTING SHOTS (1-9)</div>
                <div class="shot-buttons" id="shotButtons"></div>
            </div>

            <div class="commentary">
                <div style="color: #ffb300; font-weight: bold; margin-bottom: 8px; font-size: 11px;">📢 COMMENTARY</div>
                <div class="commentary-text" id="commentary">Ready to play...</div>
            </div>

            <div class="camera-selector">
                <button class="camera-btn active" onclick="window.gameInstance.camera.setCamera('broadcast')">📺 Broadcast</button>
                <button class="camera-btn" onclick="window.gameInstance.camera.setCamera('batting')">🏏 Batting</button>
                <button class="camera-btn" onclick="window.gameInstance.camera.setCamera('bowling')">🎯 Bowling</button>
                <button class="camera-btn" onclick="window.gameInstance.camera.setCamera('stump')">📍 Stump</button>
                <button class="camera-btn" onclick="window.gameInstance.camera.setCamera('replay')">▶️ Replay</button>
            </div>
        </div>

        <div id="menuOverlay" class="menu-overlay">
            <div class="menu-container">
                <div class="menu-logo">
                    <h1>🏏 CRICKET 3D</h1>
                </div>
                <div style="margin-bottom: 30px;">
                    <h2 style="color: #ffb300; margin-bottom: 20px; font-size: 18px;">SELECT GAME MODE</h2>
                    <div class="menu-grid">
                        <div class="menu-card" onclick="window.startGame('quick')">
                            <div class="card-icon">⚡</div>
                            <div class="card-title">Quick Match</div>
                            <div style="font-size: 12px; color: #9aa3b2;">5 Overs</div>
                        </div>
                        <div class="menu-card" onclick="window.startGame('t20')">
                            <div class="card-icon">🎯</div>
                            <div class="card-title">T20</div>
                            <div style="font-size: 12px; color: #9aa3b2;">20 Overs</div>
                        </div>
                        <div class="menu-card" onclick="window.startGame('odi')">
                            <div class="card-icon">📊</div>
                            <div class="card-title">ODI</div>
                            <div style="font-size: 12px; color: #9aa3b2;">50 Overs</div>
                        </div>
                        <div class="menu-card" onclick="window.startGame('test')">
                            <div class="card-icon">🏆</div>
                            <div class="card-title">Test</div>
                            <div style="font-size: 12px; color: #9aa3b2;">90 Balls</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="errorMessage" class="error-message">
            <h2 style="margin-bottom: 15px;">⚠️ Game Initialization Error</h2>
            <p id="errorText">Failed to initialize game.</p>
            <button onclick="location.reload()" style="margin-top: 15px; padding: 10px 20px; background: #ffb300; color: #000; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">Reload Page</button>
        </div>
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // Simple Cricket Game
        class SimpleGame {
            constructor() {
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true });

                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setClearColor(0x87ceeb);
                this.renderer.shadowMap.enabled = true;

                this.camera.position.set(0, 10, 20);
                this.camera.lookAt(0, 1, 0);

                // Lighting
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
                this.scene.add(ambientLight);

                const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
                dirLight.position.set(100, 100, 100);
                dirLight.castShadow = true;
                this.scene.add(dirLight);

                // Ground
                const groundGeometry = new THREE.PlaneGeometry(300, 300);
                const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x1a4d1a });
                const ground = new THREE.Mesh(groundGeometry, groundMaterial);
                ground.rotation.x = -Math.PI / 2;
                ground.receiveShadow = true;
                this.scene.add(ground);

                // Game state
                this.matchState = {
                    mode: 't20',
                    maxOvers: 20,
                    inning: 1,
                    balls: 0,
                    score: 0,
                    wickets: 0,
                    runs: 0,
                    striker: 0,
                    bowler: 0,
                    team1: null,
                    team2: null,
                    batStats: [],
                    bowlStats: [],
                    isGameActive: false
                };

                this.camera = {
                    setCamera: (type) => {
                        document.querySelectorAll('.camera-btn').forEach(btn => btn.classList.remove('active'));
                        event.target.classList.add('active');
                    },
                    updateCamera: () => {}
                };

                window.addEventListener('resize', () => this.onWindowResize());
                window.gameInstance = this;
            }

            initMatch(mode, team1, team2) {
                this.matchState.mode = mode;
                this.matchState.team1 = team1;
                this.matchState.team2 = team2;
                this.matchState.maxOvers = {quick: 5, t20: 20, odi: 50, test: 15}[mode];
                this.matchState.isGameActive = true;

                this.matchState.batStats = team1.players.map(name => ({
                    name, runs: 0, balls: 0, fours: 0, sixes: 0
                }));

                this.matchState.bowlStats = team2.players.map(name => ({
                    name, balls: 0, runs: 0, wickets: 0
                }));

                document.getElementById('menuOverlay').classList.add('hidden');
                this.updateUI();
            }

            playShot(shotIndex) {
                if (!this.matchState.isGameActive) return;

                const shots = [
                    'Cover Drive', 'Straight Drive', 'Flick', 'Pull', 'Hook',
                    'Cut', 'Sweep', 'Reverse Sweep', 'Upper Cut', 'Lofted Drive',
                    'Paddle Sweep', 'Ramp', 'Helicopter', 'Defend', 'Leave'
                ];

                const shot = shots[shotIndex];
                const runs = Math.floor(Math.random() * 7);

                this.matchState.score += runs;
                this.matchState.runs += runs;
                this.matchState.balls += 1;

                const batter = this.matchState.batStats[this.matchState.striker];
                batter.balls += 1;
                batter.runs += runs;

                if (runs === 4) batter.fours += 1;
                if (runs === 6) batter.sixes += 1;

                let commentary = `${batter.name} plays ${shot}`;
                if (runs === 6) commentary += ' - SIX! 🔥';
                else if (runs === 4) commentary += ' - FOUR! 💥';
                else if (runs === 0) commentary += ' - DOT';

                document.getElementById('commentary').textContent = commentary;

                if (this.matchState.balls % 6 === 0) {
                    const over = Math.floor(this.matchState.balls / 6);
                    if (over >= this.matchState.maxOvers) {
                        this.matchState.isGameActive = false;
                        document.getElementById('commentary').textContent = `🏁 Match Over! Final Score: ${this.matchState.score}/${this.matchState.wickets}`;
                    }
                }

                this.updateUI();
            }

            updateUI() {
                const overs = Math.floor(this.matchState.balls / 6);
                const remainBalls = this.matchState.balls % 6;

                if (this.matchState.team1) {
                    document.getElementById('team1Name').textContent = this.matchState.team1.name;
                    document.getElementById('team1Score').textContent = `${this.matchState.score}/${this.matchState.wickets}`;
                    document.getElementById('team1Overs').textContent = `${overs}.${remainBalls} ov`;
                }

                if (this.matchState.team2) {
                    document.getElementById('team2Name').textContent = this.matchState.team2.name;
                }
            }

            onWindowResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }

            render() {
                this.renderer.render(this.scene, this.camera);
                requestAnimationFrame(() => this.render());
            }
        }

        // Teams
        const TEAMS = [
            {
                name: 'Mumbai Indians',
                emoji: '🔵',
                players: ['Rohit Sharma', 'Suryakumar Yadav', 'Hardik Pandya', 'Jasprit Bumrah', 'Tilak Varma', 'Naman Dhir', 'Robin Minz', 'Karn Sharma', 'Trent Boult', 'Deepak Chahar', 'Ashwani Kumar']
            },
            {
                name: 'Chennai Super Kings',
                emoji: '🟡',
                players: ['Ruturaj Gaikwad', 'Rachin Ravindra', 'MS Dhoni', 'Ravindra Jadeja', 'Shivam Dube', 'Sam Curran', 'Matheesha Pathirana', 'Deepak Chahar', 'Noor Ahmad', 'Khaleel Ahmed', 'Nathan Ellis']
            },
            {
                name: 'Royal Challengers',
                emoji: '🔴',
                players: ['Virat Kohli', 'Phil Salt', 'Rajat Patidar', 'Liam Livingstone', 'Hardik Pandya', 'Krunal Pandya', 'Bhuvneshwar Kumar', 'Josh Hazlewood', 'Yash Dayal', 'Suyash Sharma', 'Jitesh Sharma']
            },
            {
                name: 'Kolkata Knight Riders',
                emoji: '🟣',
                players: ['Ajinkya Rahane', 'Quinton de Kock', 'Andre Russell', 'Rinku Singh', 'Sunil Narine', 'Angkrish Raghuvanshi', 'Varun Chakravarthy', 'Harshit Rana', 'Spencer Johnson', 'Anrich Nortje', 'Venkatesh Iyer']
            }
        ];

        // Initialize
        let gameInstance;

        function initGame() {
            try {
                gameInstance = new SimpleGame();

                // Create shot buttons
                const shots = ['Cover Drive', 'Straight Drive', 'Flick', 'Pull', 'Hook', 'Cut', 'Sweep', 'Reverse Sweep', 'Upper Cut'];
                const shotButtons = document.getElementById('shotButtons');

                for (let i = 0; i < 9; i++) {
                    const btn = document.createElement('button');
                    btn.className = 'shot-btn';
                    btn.textContent = `${i + 1}`;
                    btn.onclick = () => gameInstance.playShot(i);
                    shotButtons.appendChild(btn);

                    // Keyboard shortcut
                    document.addEventListener('keydown', (e) => {
                        if (e.key === (i + 1).toString()) gameInstance.playShot(i);
                    });
                }

                gameInstance.render();
                console.log('✅ Game initialized successfully!');
            } catch (error) {
                console.error('❌ Error:', error);
                document.getElementById('errorText').textContent = `Error: ${error.message}`;
                document.getElementById('errorMessage').classList.add('show');
            }
        }

        function startGame(mode) {
            const idx1 = Math.floor(Math.random() * TEAMS.length);
            let idx2 = Math.floor(Math.random() * TEAMS.length);
            while (idx2 === idx1) idx2 = Math.floor(Math.random() * TEAMS.length);

            gameInstance.initMatch(mode, TEAMS[idx1], TEAMS[idx2]);
        }

        // Start on load
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initGame);
        } else {
            initGame();
        }
    </script>
</body>
</html>
